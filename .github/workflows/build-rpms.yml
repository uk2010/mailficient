name: Build RPM packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  rpm:
    name: RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            flatpak_arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            flatpak_arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rpm file patchelf libglib2.0-bin

      - name: Install GNOME 50 SDK and runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Camel-enabled application tree
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --arch=${{ matrix.flatpak_arch }} \
            "flatpak-build-${{ matrix.arch }}" \
            packaging/com.local.Mailficient.Devel.json

      - name: Verify application dependency closure
        run: |
          flatpak build --readonly "flatpak-build-${{ matrix.arch }}" \
            sh -eu -c '
              for elf_file in \
                /app/bin/mailficient \
                /app/bin/mailficient-addressbook-probe \
                /app/lib/evolution-data-server/camel-providers/libcamelimapx.so \
                /app/lib/evolution-data-server/camel-providers/libcamelsmtp.so; do
                test -e "$elf_file"
                if ldd "$elf_file" | grep -F "not found"; then
                  exit 1
                fi
              done
              test -f /app/share/glib-2.0/schemas/org.gnome.calendar.gschema.xml
              test -f /app/share/glib-2.0/schemas/org.gnome.GWeather4.gschema.xml
              test -f /app/lib/libgweather-4/Locations.bin
              strings /app/bin/mailficient | grep -Fq /org/gnome/calendar/ui/gui/gcal-window.ui
            '

      - name: Build RPM package
        env:
          MAILFICIENT_FLATPAK_APP_TREE: ${{ github.workspace }}/flatpak-build-${{ matrix.arch }}/files
          MAILFICIENT_RPM_ARCHITECTURE: ${{ matrix.arch }}
        run: tools/build-rpm.sh

      - name: Verify RPM package metadata
        run: |
          package=$(find dist -maxdepth 1 -name 'mailficient-*.${{ matrix.arch }}.rpm' -print -quit)
          test "$(rpm -qp --qf '%{ARCH}' "$package")" = "${{ matrix.arch }}"
          if rpm -qpR "$package" | grep -Fq gnome-calendar; then
            echo "The package must not depend on the separate GNOME Calendar app" >&2
            exit 1
          fi
          rpm -qpl "$package" > rpm-contents.txt
          grep -Fq /mailficient/schemas/gschemas.compiled rpm-contents.txt
          grep -Fq /mailficient/libgweather-4/Locations.bin rpm-contents.txt

      - name: Upload RPM package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailficient-${{ matrix.arch }}-rpm
          path: |
            dist/mailficient-*.${{ matrix.arch }}.rpm
            dist/mailficient-*.${{ matrix.arch }}.rpm.sha256
          if-no-files-found: error

      - name: Attest RPM package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mailficient-*.${{ matrix.arch }}.rpm
