name: Build RPM packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            flatpak_arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            flatpak_arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rpm file patchelf

      - name: Install GNOME 49 SDK and runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Build Camel-enabled application tree
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --arch=${{ matrix.flatpak_arch }} \
            "flatpak-build-${{ matrix.arch }}" \
            packaging/com.local.Mailficient.Devel.json

      - name: Verify application dependency closure
        run: |
          flatpak build --readonly "flatpak-build-${{ matrix.arch }}" \
            sh -eu -c '
              for elf_file in \
                /app/bin/mailficient \
                /app/bin/mailficient-addressbook-probe \
                /app/lib/evolution-data-server/camel-providers/libcamelimapx.so \
                /app/lib/evolution-data-server/camel-providers/libcamelsmtp.so; do
                test -e "$elf_file"
                if ldd "$elf_file" | grep -F "not found"; then
                  exit 1
                fi
              done
            '

      - name: Build RPM package
        env:
          MAILFICIENT_FLATPAK_APP_TREE: ${{ github.workspace }}/flatpak-build-${{ matrix.arch }}/files
          MAILFICIENT_RPM_ARCHITECTURE: ${{ matrix.arch }}
        run: tools/build-rpm.sh

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: mailficient-${{ matrix.arch }}-rpm
          path: |
            dist/mailficient-*.${{ matrix.arch }}.rpm
            dist/mailficient-*.${{ matrix.arch }}.rpm.sha256
          if-no-files-found: error
