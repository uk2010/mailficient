name: Build Flatpak bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Install GNOME 49 SDK and runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes --arch=${{ matrix.arch }} flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Build and test application
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --arch=${{ matrix.arch }} \
            --repo="flatpak-repo-${{ matrix.arch }}" \
            "flatpak-build-${{ matrix.arch }}" \
            packaging/com.local.Mailficient.Devel.json

      - name: Verify application dependency closure
        run: |
          flatpak build --readonly "flatpak-build-${{ matrix.arch }}" \
            sh -eu -c '
              for elf_file in \
                /app/bin/mailficient \
                /app/bin/mailficient-addressbook-probe \
                /app/lib/evolution-data-server/camel-providers/libcamelimapx.so \
                /app/lib/evolution-data-server/camel-providers/libcamelsmtp.so; do
                test -e "$elf_file"
                if ldd "$elf_file" | grep -F "not found"; then
                  exit 1
                fi
              done
            '

      - name: Create Flatpak bundle and checksum
        id: bundle
        shell: bash
        run: |
          version=$(grep -o "version: '[0-9][^']*'" meson.build |
            head -n 1 |
            cut -d "'" -f 2)
          bundle="Mailficient-${version}-${{ matrix.arch }}.flatpak"
          flatpak build-bundle \
            --arch=${{ matrix.arch }} \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "flatpak-repo-${{ matrix.arch }}" \
            "$bundle" \
            com.local.Mailficient \
            master
          sha256sum "$bundle" > "$bundle.sha256"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: mailficient-${{ matrix.arch }}-flatpak
          path: |
            ${{ steps.bundle.outputs.bundle }}
            ${{ steps.bundle.outputs.bundle }}.sha256
          if-no-files-found: error
