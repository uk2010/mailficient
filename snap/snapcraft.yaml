name: mailficient
base: core24
version: '0.3.1'
title: Mailficient
summary: A native desktop email client
description: |
  Mailficient is a native GTK email client for IMAP and SMTP accounts. It
  provides bounded mailbox browsing, background synchronization, search,
  conversations, attachments, tasks, calendar invitations, rules, labels,
  phishing protection, templates, and an offline cache.
icon: data/icons/hicolor/512x512/apps/com.local.Mailficient.png
contact: https://github.com/uk2010/mailficient/issues
issues: https://github.com/uk2010/mailficient/issues
license: GPL-3.0-or-later
source-code: https://github.com/uk2010/mailficient
website: https://github.com/uk2010/mailficient

grade: stable
confinement: strict
compression: lzo

# Each package is compiled natively. This avoids cross-compiled WebKitGTK and
# Evolution Data Server binaries and makes the same manifest usable locally or
# with Launchpad's remote builders.
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

layout:
  /usr/bin/gpg-agent:
    bind-file: $SNAP/usr/bin/gpg-agent

apps:
  mailficient:
    command: usr/bin/mailficient
    desktop: usr/share/applications/com.local.Mailficient.desktop
    # BackgroundAutostartService installs this file in SNAP_USER_DATA only
    # after a real-account Draft or Outbox item needs background work.
    autostart: com.local.Mailficient.Background.desktop
    common-id: com.local.Mailficient
    extensions: [gnome]
    environment:
      EDS_CAMEL_PROVIDER_DIR: $SNAP/usr/lib/evolution-data-server/camel-providers
    plugs:
      - network
      - network-status
      - online-accounts-service
      - password-manager-service
      - calendar-service
      - contacts-service
      - home
      - removable-media

parts:
  mailficient:
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dcamel=enabled
      - -Dwebkit=enabled
      - -Dsecret=enabled
      - -Daddressbook=enabled
      - -Dcalendar=enabled
    build-packages:
      - valac
      - libcamel1.2-dev
      - libecal2.0-dev
      - libebook1.2-dev
      - libgee-0.8-dev
      - libical-dev
      - libjson-glib-dev
      - libsecret-1-dev
      - libssl-dev
      - libsqlite3-dev
      - libwebkitgtk-6.0-dev
      - libxml2-dev
    stage-packages:
      - enchant-2
      - evolution-data-server
      - gpg
      - gpg-agent
      - hunspell-en-us
      - libcamel-1.2-64t64
      - libecal-2.0-3
      - libebook-1.2-21t64
      - libgee-0.8-2
      - libical3t64
      - libjson-glib-1.0-0
      - libsecret-1-0
      - libssl3t64
      - libsqlite3-0
      - libwebkitgtk-6.0-4
      - libxml2
    override-build: |
      craftctl default
      # The source service file intentionally targets Flatpak's /app prefix.
      # A snap is launched through /snap/bin instead of exporting that service.
      sed -i 's/^DBusActivatable=true$/DBusActivatable=false/' \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.local.Mailficient.desktop"
      sed -i \
        -e 's|^Exec=.*$|Exec=mailficient|' \
        -e 's|^Icon=.*$|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/com.local.Mailficient.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.local.Mailficient.desktop"
      rm -f \
        "$CRAFT_PART_INSTALL/usr/share/dbus-1/services/com.local.Mailficient.service"
      chmod 0755 \
        "$CRAFT_PART_INSTALL/usr/bin/mailficient" \
        "$CRAFT_PART_INSTALL/usr/bin/mailficient-addressbook-probe"
      chmod 0644 \
        "$CRAFT_PART_INSTALL/etc/xdg/autostart/com.local.Mailficient.Background.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.local.Mailficient.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/com.local.Mailficient.metainfo.xml"
      find "$CRAFT_PART_INSTALL/usr/share/icons/hicolor" -type d -exec chmod 0755 {} +
      find "$CRAFT_PART_INSTALL/usr/share/icons/hicolor" -type f -exec chmod 0644 {} +
